<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>হিসাব খাতা</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase Compat SDKs (Zero-error classic scripts) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Config File (firebase-config.js) -->
    <script src="firebase-config.js"></script>

    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f8);
            --text-color: var(--tg-theme-text-color, #111827);
            --hint-color: var(--tg-theme-hint-color, #6b7280);
            --btn-color: var(--tg-theme-button-color, #2563eb);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(156, 163, 175, 0.25);
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; user-select: none; }
        * { box-sizing: border-box; }

        .view { display: none; padding: 16px 16px 90px; min-height: 100vh; }
        .view.active { display: block; }

        h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
        h2 { font-size: 20px; font-weight: 600; margin: 0; }
        .subtitle { font-size: 13px; color: var(--hint-color); }

        .card { background-color: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); }
        .user-card { cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: transform 0.1s; }
        .user-card:active { transform: scale(0.98); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: var(--hint-color); margin-bottom: 4px; }
        .stat-val { font-size: 16px; font-weight: 700; }

        input, select { width: 100%; padding: 13px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background-color: var(--bg-color); color: var(--text-color); font-size: 15px; outline: none; }
        input:focus { border-color: var(--btn-color); }

        .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--btn-color); color: var(--btn-text); }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-color); }

        .fab { position: fixed; bottom: 24px; right: 24px; width: 58px; height: 58px; border-radius: 29px; background-color: var(--btn-color); color: var(--btn-text); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.25); cursor: pointer; z-index: 99; border: none; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .search-box { position: relative; margin-bottom: 14px; }
        .search-box input { padding-left: 38px; margin-bottom: 0; }
        .search-icon { position: absolute; left: 12px; top: 13px; fill: var(--hint-color); width: 18px; height: 18px; }

        .tx-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .tx-item:last-child { border-bottom: none; }
        .tx-info { flex: 1; }
        .tx-desc { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
        .tx-meta { font-size: 11px; color: var(--hint-color); }
        .tx-amount { font-size: 16px; font-weight: 700; text-align: right; }
        .tx-actions { display: flex; gap: 8px; margin-top: 6px; }

        .icon-btn { background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text-color); }
        .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .text-success { color: var(--success) !important; }
        .text-danger { color: var(--danger) !important; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #222; color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; transition: all 0.3s; pointer-events: none; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast.error { background: var(--danger); }

        .empty-state { text-align: center; padding: 40px 16px; color: var(--hint-color); }
        .empty-state svg { width: 44px; height: 44px; fill: var(--border); margin-bottom: 10px; }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--btn-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- লোডার স্ক্রিন -->
    <div id="loader-view" class="view active">
        <div class="loader-container">
            <div class="spinner"></div>
            <div id="loader-text" style="color: var(--hint-color); font-weight: 500;">ডাটা লোড হচ্ছে...</div>
        </div>
    </div>

    <!-- হোম ড্যাশবোর্ড -->
    <div id="home-view" class="view">
        <div class="header">
            <div>
                <h1>হিসাব খাতা</h1>
                <div class="subtitle">আপনার সকল খাতার তালিকা</div>
            </div>
            <button class="icon-btn" onclick="App.init()" title="রিফ্রেশ">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-account" placeholder="খাতা খুঁজুন..." oninput="App.UI.renderAccounts(this.value)">
        </div>

        <div id="account-list"></div>

        <button class="fab" onclick="App.Modals.openAccountModal()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <!-- নির্দিষ্ট খাতার ড্যাশবোর্ড -->
    <div id="account-view" class="view">
        <div class="header">
            <button class="icon-btn" onclick="App.Navigation.goHome()" style="border:none; padding:4px;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <h2 id="current-account-name" style="flex: 1; text-align: center; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</h2>
            <button class="icon-btn" onclick="App.Modals.openAccountActionModal()" style="border:none; padding:4px;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>

        <div class="card" style="text-align: center; padding: 20px 16px;">
            <div class="stat-label">বর্তমান ব্যালেন্স</div>
            <div id="dash-balance" style="font-size: 30px; font-weight: 800; margin: 6px 0;">৳০</div>
            <div class="stat-grid">
                <div class="stat-item">
                    <span class="stat-label">মোট আয় (+)</span>
                    <span id="dash-income" class="stat-val text-success">৳০</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">মোট ব্যয় (-)</span>
                    <span id="dash-expense" class="stat-val text-danger">৳০</span>
                </div>
            </div>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-tx" placeholder="লেনদেন খুঁজুন..." oninput="App.UI.renderDashboard(this.value)">
        </div>

        <div class="card" style="padding: 4px 16px;">
            <div id="tx-list"></div>
        </div>

        <button class="fab" onclick="App.Modals.openTxModal()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <!-- মোডাল: নতুন বা এডিট খাতা -->
    <div id="modal-account" class="modal-overlay" onclick="App.Modals.closeOnClickOutside(event, 'modal-account')">
        <div class="modal-content">
            <h2 id="modal-account-title" style="margin-bottom: 14px;">নতুন খাতা তৈরি</h2>
            <div style="margin-bottom: 6px; font-size: 13px; color: var(--hint-color);">খাতার বা ব্যক্তির নাম:</div>
            <input type="text" id="inp-account-name" placeholder="যেমন: সালাম, বাজার খরচ, ৭/১০/২০২৬">
            <div style="display: flex; gap: 10px; margin-top: 14px;">
                <button class="btn btn-outline" onclick="App.Modals.close('modal-account')">বাতিল</button>
                <button class="btn btn-primary" id="btn-save-account" onclick="App.Actions.saveAccount()">সংরক্ষণ করুন</button>
            </div>
        </div>
    </div>

    <!-- মোডাল: খাতার অ্যাকশন (থ্রি ডট) -->
    <div id="modal-account-action" class="modal-overlay" onclick="App.Modals.closeOnClickOutside(event, 'modal-account-action')">
        <div class="modal-content">
            <h2 style="margin-bottom: 16px;">খাতা সেটিংস</h2>
            <button class="btn btn-outline" style="margin-bottom: 10px;" onclick="App.Modals.editCurrentAccount()">✏️ খাতার নাম পরিবর্তন করুন</button>
            <button class="btn btn-danger" onclick="App.Modals.confirmDeleteAccount()">🗑️ সম্পূর্ণ খাতা মুছে ফেলুন</button>
            <button class="btn btn-outline" style="margin-top: 10px; border: none;" onclick="App.Modals.close('modal-account-action')">বাতিল</button>
        </div>
    </div>

    <!-- মোডাল: লেনদেন যোগ/এডিট -->
    <div id="modal-tx" class="modal-overlay" onclick="App.Modals.closeOnClickOutside(event, 'modal-tx')">
        <div class="modal-content">
            <h2 id="modal-tx-title" style="margin-bottom: 14px;">হিসাব যোগ করুন</h2>
            
            <div class="stat-grid" style="border: none; padding: 0; margin-bottom: 12px;">
                <button id="btn-type-income" class="btn btn-outline text-success" style="border-color: var(--success); background: rgba(16, 185, 129, 0.1);" onclick="App.UI.selectTxType('income')">আয় (+)</button>
                <button id="btn-type-expense" class="btn btn-outline text-danger" onclick="App.UI.selectTxType('expense')">ব্যয় (-)</button>
            </div>
            <input type="hidden" id="inp-tx-type" value="income">

            <div style="font-size: 13px; color: var(--hint-color); margin-bottom: 4px;">বিবরণ:</div>
            <input type="text" id="inp-tx-desc" placeholder="যেমন: আপেল, বেতন, লোন">
            
            <div style="font-size: 13px; color: var(--hint-color); margin-bottom: 4px;">পরিমাণ (৳):</div>
            <input type="number" id="inp-tx-amount" placeholder="0" min="0" step="any">

            <div style="display: flex; gap: 10px; margin-top: 14px;">
                <button class="btn btn-outline" onclick="App.Modals.close('modal-tx')">বাতিল</button>
                <button class="btn btn-primary" id="btn-save-tx" onclick="App.Actions.saveTransaction()">সংরক্ষণ করুন</button>
            </div>
        </div>
    </div>

    <!-- মোডাল: ডিলিট নিশ্চিতকরণ -->
    <div id="modal-confirm" class="modal-overlay" onclick="App.Modals.closeOnClickOutside(event, 'modal-confirm')">
        <div class="modal-content">
            <h2 id="confirm-title" style="color: var(--danger); margin-bottom: 8px;">সতর্কতা!</h2>
            <p id="confirm-msg" style="color: var(--hint-color); margin-bottom: 20px; font-size: 14px;">আপনি কি নিশ্চিত?</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" onclick="App.Modals.close('modal-confirm')">না, বাতিল</button>
                <button class="btn btn-danger" id="btn-confirm-action">হ্যাঁ, মুছে ফেলুন</button>
            </div>
        </div>
    </div>

    <div id="toast">বার্তা</div>

<script>
/**
 * হিসাব খাতা - প্রোডাকশন মাস্টার লজিক
 */
window.tg = window.Telegram ? window.Telegram.WebApp : null;
if (window.tg) {
    try {
        window.tg.expand();
        window.tg.ready();
    } catch(e) {}
}

// সেফ হেল্পার
const el = (tag, attrs = {}, children = []) => {
    const element = document.createElement(tag);
    for (const [key, val] of Object.entries(attrs)) {
        if (key.startsWith('on') && typeof val === 'function') element.addEventListener(key.substring(2).toLowerCase(), val);
        else if (key === 'className') element.className = val;
        else if (key === 'text') element.textContent = val;
        else if (key === 'html') element.innerHTML = val;
        else if (key === 'style') Object.assign(element.style, val);
        else element.setAttribute(key, val);
    }
    children.forEach(child => {
        if (typeof child === 'string') element.appendChild(document.createTextNode(child));
        else if (child instanceof Node) element.appendChild(child);
    });
    return element;
};

const Utils = {
    generateId: () => 'id_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6),
    formatMoney: (num) => parseFloat(num || 0).toLocaleString('bn-BD', { minimumFractionDigits: 0, maximumFractionDigits: 2 }),
    formatDate: (d) => new Date(d).toLocaleString('bn-BD', { hour12: true, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    parseNum: (val) => { const n = parseFloat(val); return (isNaN(n) || n <= 0) ? 0 : n; }
};

// গ্লোবাল App অবজেক্ট
window.App = {
    db: null,
    Data: { users: [], accountDocIds: {}, transactions: {} },
    State: { currentAccount: null, txEditMode: false, currentTxId: null, isSaving: false },

    async init() {
        App.UI.showView('loader-view');
        
        // ফায়ারবেস ইনিশিয়ালাইজেশন
        const config = window.firebaseConfig;
        if (!config || !config.apiKey || config.apiKey.includes("আপনার_")) {
            App.UI.showToast("⚠️ firebase-config.js এ আপনার ফায়ারবেস কি বসান!", true);
            document.getElementById('loader-text').textContent = "⚠️ ফায়ারবেস কনফিগারেশন মিসিং!";
            // কনফিগ না থাকলেও UI লোড হবে যাতে অ্যাপ ব্লক না হয়
            setTimeout(() => App.Navigation.goHome(), 1000);
            return;
        }

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(config);
            }
            App.db = firebase.firestore();

            // ডাটা লোড ও অটো-রিকভারি
            await App.loadAndRecoverData();
            App.Navigation.goHome();
        } catch (err) {
            console.error("Firebase Init Error:", err);
            App.UI.showToast("ফায়ারবেস কানেকশনে সমস্যা হয়েছে!", true);
            App.Navigation.goHome();
        }
    },

    // অটো-রিকভারি সহ ডাটা লোড
    async loadAndRecoverData() {
        if (!App.db) return;
        App.Data.users = [];
        App.Data.accountDocIds = {};
        App.Data.transactions = {};

        const accountMap = new Map();

        // ১. অ্যাকাউন্ট কালেকশন লোড
        try {
            const accSnap = await App.db.collection("accounts").get();
            accSnap.forEach(doc => {
                const data = doc.data();
                const name = data.name || doc.id;
                if (name) {
                    accountMap.set(name, doc.id);
                }
            });
        } catch (e) {
            console.warn("Accounts fetch issue:", e);
        }

        // ২. লেনদেন কালেকশন লোড ও হারিয়ে যাওয়া অ্যাকাউন্ট রিকভারি
        try {
            const txSnap = await App.db.collection("transactions").get();
            txSnap.forEach(doc => {
                const tx = doc.data();
                if (tx && tx.account) {
                    const accName = tx.account;
                    
                    // রিকভারি লজিক: লেনদেন আছে কিন্তু অ্যাকাউন্ট লিস্টে নেই (যেমন ৭/১০/২০২৬)
                    if (!accountMap.has(accName)) {
                        const newDocId = Utils.generateId();
                        accountMap.set(accName, newDocId);
                        // স্বয়ংক্রিয়ভাবে ফায়ারবেসে সেভ করে রাখা যাতে আর কখনোই না হারায়
                        App.db.collection("accounts").doc(newDocId).set({ name: accName, createdAt: Date.now() }).catch(()=>{});
                    }

                    if (!App.Data.transactions[accName]) {
                        App.Data.transactions[accName] = [];
                    }
                    App.Data.transactions[accName].push(tx);
                }
            });
        } catch (e) {
            console.warn("Transactions fetch issue:", e);
        }

        // ৩. টেলিগ্রাম ক্লাউড স্টোরেজের পুরনো ডাটা থাকলে তা-ও রিকভার করা
        if (window.tg && window.tg.CloudStorage) {
            try {
                window.tg.CloudStorage.getItem('multi_user_finance_data', (err, val) => {
                    if (!err && val) {
                        try {
                            const legacy = JSON.parse(val);
                            if (legacy && legacy.users) {
                                legacy.users.forEach(u => {
                                    if (!accountMap.has(u)) {
                                        accountMap.set(u, Utils.generateId());
                                    }
                                    if (legacy.transactions && legacy.transactions[u]) {
                                        if (!App.Data.transactions[u]) App.Data.transactions[u] = [];
                                        legacy.transactions[u].forEach(tx => {
                                            if (!App.Data.transactions[u].some(existing => existing.desc === tx.desc && existing.amount === tx.amount)) {
                                                App.Data.transactions[u].push(tx);
                                            }
                                        });
                                    }
                                });
                                App.UI.renderAccounts();
                            }
                        } catch(e){}
                    }
                });
            } catch(e){}
        }

        // স্টেট সেট করা
        accountMap.forEach((docId, name) => {
            App.Data.users.push(name);
            App.Data.accountDocIds[name] = docId;
            if (!App.Data.transactions[name]) App.Data.transactions[name] = [];
        });
    },

    Navigation: {
        goHome() {
            App.State.currentAccount = null;
            App.UI.showView('home-view');
            document.getElementById('search-account').value = '';
            App.UI.renderAccounts();
        },
        openAccount(name) {
            App.State.currentAccount = name;
            App.UI.showView('account-view');
            document.getElementById('current-account-name').textContent = name;
            document.getElementById('search-tx').value = '';
            App.UI.renderDashboard();
        }
    },

    Actions: {
        async saveAccount() {
            const btn = document.getElementById('btn-save-account');
            const inp = document.getElementById('inp-account-name');
            const newName = inp.value.trim();
            const oldName = App.State.currentAccount;
            const isEdit = !!oldName;

            if (!newName) return App.UI.showToast("অনুগ্রহ করে একটি নাম দিন", true);

            const exists = App.Data.users.find(u => u.toLowerCase() === newName.toLowerCase());
            if (exists && (!isEdit || oldName.toLowerCase() !== newName.toLowerCase())) {
                return App.UI.showToast("এই নামে আগেই খাতা তৈরি করা আছে!", true);
            }

            btn.disabled = true;
            btn.textContent = "সংরক্ষণ হচ্ছে...";

            try {
                if (isEdit) {
                    if (oldName !== newName) {
                        const docId = App.Data.accountDocIds[oldName] || Utils.generateId();
                        const batch = App.db.batch();

                        batch.set(App.db.collection("accounts").doc(docId), { name: newName }, { merge: true });

                        const txs = App.Data.transactions[oldName] || [];
                        txs.forEach(t => {
                            t.account = newName;
                            batch.set(App.db.collection("transactions").doc(t.id), t);
                        });

                        await batch.commit();

                        const idx = App.Data.users.indexOf(oldName);
                        App.Data.users[idx] = newName;
                        App.Data.accountDocIds[newName] = docId;
                        delete App.Data.accountDocIds[oldName];
                        App.Data.transactions[newName] = txs;
                        delete App.Data.transactions[oldName];
                        App.State.currentAccount = newName;
                    }
                } else {
                    const newDocId = Utils.generateId();
                    if (App.db) {
                        await App.db.collection("accounts").doc(newDocId).set({ name: newName, createdAt: Date.now() });
                    }
                    App.Data.users.unshift(newName);
                    App.Data.accountDocIds[newName] = newDocId;
                    App.Data.transactions[newName] = [];
                }

                App.Modals.close('modal-account');
                App.Modals.close('modal-account-action');

                if (isEdit) {
                    document.getElementById('current-account-name').textContent = newName;
                    App.UI.renderDashboard();
                } else {
                    App.UI.renderAccounts();
                }
                App.UI.showToast("খাতা সংরক্ষিত হয়েছে");
            } catch (err) {
                console.error(err);
                App.UI.showToast("সংরক্ষণ করা যায়নি, ইন্টারনেট চেক করুন!", true);
            } finally {
                btn.disabled = false;
                btn.textContent = "সংরক্ষণ করুন";
            }
        },

        async deleteAccountConfirm() {
            const name = App.State.currentAccount;
            App.Modals.close('modal-confirm');
            App.Modals.close('modal-account-action');
            App.UI.showToast("মুছে ফেলা হচ্ছে...");

            try {
                if (App.db) {
                    const batch = App.db.batch();
                    const txs = App.Data.transactions[name] || [];
                    txs.forEach(t => batch.delete(App.db.collection("transactions").doc(t.id)));
                    
                    const docId = App.Data.accountDocIds[name];
                    if (docId) batch.delete(App.db.collection("accounts").doc(docId));
                    await batch.commit();
                }

                App.Data.users = App.Data.users.filter(u => u !== name);
                delete App.Data.transactions[name];
                delete App.Data.accountDocIds[name];

                App.Navigation.goHome();
                App.UI.showToast("খাতা মুছে ফেলা হয়েছে");
            } catch (err) {
                console.error(err);
                App.UI.showToast("মুছে ফেলা সম্ভব হয়নি!", true);
            }
        },

        async saveTransaction() {
            const desc = document.getElementById('inp-tx-desc').value.trim();
            const amount = Utils.parseNum(document.getElementById('inp-tx-amount').value);
            const type = document.getElementById('inp-tx-type').value;
            const btn = document.getElementById('btn-save-tx');
            const account = App.State.currentAccount;

            if (!desc) return App.UI.showToast("বিবরণ দিন", true);
            if (amount <= 0) return App.UI.showToast("সঠিক পরিমাণ দিন", true);

            btn.disabled = true;
            btn.textContent = "সংরক্ষণ হচ্ছে...";

            const txObj = {
                id: App.State.currentTxId || Utils.generateId(),
                account: account,
                desc: desc,
                amount: amount,
                type: type,
                date: App.State.txEditMode ? App.Data.transactions[account].find(t => t.id === App.State.currentTxId).date : Utils.formatDate(new Date()),
                timestamp: App.State.txEditMode ? App.Data.transactions[account].find(t => t.id === App.State.currentTxId).timestamp : Date.now()
            };

            try {
                if (App.db) {
                    await App.db.collection("transactions").doc(txObj.id).set(txObj);
                }

                if (App.State.txEditMode) {
                    const idx = App.Data.transactions[account].findIndex(t => t.id === txObj.id);
                    App.Data.transactions[account][idx] = txObj;
                } else {
                    App.Data.transactions[account].unshift(txObj);
                }

                App.Modals.close('modal-tx');
                App.UI.renderDashboard();
                App.UI.showToast("লেনদেন সংরক্ষিত হয়েছে");
            } catch (err) {
                console.error(err);
                App.UI.showToast("সেভ করা যায়নি! আবার চেষ্টা করুন।", true);
            } finally {
                btn.disabled = false;
                btn.textContent = "সংরক্ষণ করুন";
            }
        },

        async deleteTxConfirm(id) {
            const account = App.State.currentAccount;
            App.Modals.close('modal-confirm');
            App.UI.showToast("মুছে ফেলা হচ্ছে...");

            try {
                if (App.db) {
                    await App.db.collection("transactions").doc(id).delete();
                }
                App.Data.transactions[account] = App.Data.transactions[account].filter(t => t.id !== id);
                App.UI.renderDashboard();
                App.UI.showToast("লেনদেন মুছে ফেলা হয়েছে");
            } catch (err) {
                console.error(err);
                App.UI.showToast("মুছতে সমস্যা হয়েছে!", true);
            }
        }
    },

    UI: {
        showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        },

        showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = isError ? 'error show' : 'show';
            setTimeout(() => t.className = '', 2800);
        },

        selectTxType(type) {
            document.getElementById('inp-tx-type').value = type;
            const btnInc = document.getElementById('btn-type-income');
            const btnExp = document.getElementById('btn-type-expense');
            if (type === 'income') {
                btnInc.style.borderColor = 'var(--success)';
                btnInc.style.background = 'rgba(16, 185, 129, 0.1)';
                btnExp.style.borderColor = 'var(--border)';
                btnExp.style.background = 'transparent';
            } else {
                btnExp.style.borderColor = 'var(--danger)';
                btnExp.style.background = 'rgba(239, 68, 68, 0.1)';
                btnInc.style.borderColor = 'var(--border)';
                btnInc.style.background = 'transparent';
            }
        },

        renderAccounts(filterQuery = '') {
            const list = document.getElementById('account-list');
            list.innerHTML = '';
            const query = (filterQuery || '').toLowerCase();
            const filtered = App.Data.users.filter(u => u.toLowerCase().includes(query));

            if (filtered.length === 0) {
                list.appendChild(el('div', { className: 'empty-state' }, [
                    el('div', { html: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>' }),
                    el('div', { text: query ? 'কোনো খাতা পাওয়া যায়নি' : 'কোনো খাতা নেই। নিচের "+" বাটনে চাপ দিয়ে খাতা খুলুন।' })
                ]));
                return;
            }

            filtered.forEach(name => {
                const txs = App.Data.transactions[name] || [];
                let bal = 0;
                txs.forEach(t => bal += (t.type === 'income' ? t.amount : -t.amount));

                const card = el('div', { className: 'card user-card', onClick: () => App.Navigation.openAccount(name) }, [
                    el('div', {}, [
                        el('div', { text: name, className: 'tx-desc', style: { fontSize: '16px' } }),
                        el('div', { text: `${txs.length} টি লেনদেন`, className: 'tx-meta' })
                    ]),
                    el('div', { text: `৳${Utils.formatMoney(bal)}`, className: `tx-amount ${bal < 0 ? 'text-danger' : 'text-success'}` })
                ]);
                list.appendChild(card);
            });
        },

        renderDashboard(filterQuery = '') {
            if (!App.State.currentAccount) return;
            const txs = App.Data.transactions[App.State.currentAccount] || [];

            let inc = 0, exp = 0;
            txs.forEach(t => {
                if (t.type === 'income') inc += t.amount;
                else exp += t.amount;
            });
            const bal = inc - exp;

            document.getElementById('dash-balance').textContent = `৳${Utils.formatMoney(bal)}`;
            document.getElementById('dash-balance').className = bal < 0 ? 'text-danger' : 'text-success';
            document.getElementById('dash-income').textContent = `৳${Utils.formatMoney(inc)}`;
            document.getElementById('dash-expense').textContent = `৳${Utils.formatMoney(exp)}`;

            const list = document.getElementById('tx-list');
            list.innerHTML = '';
            const query = (filterQuery || '').toLowerCase();
            const filtered = txs.filter(t => t.desc.toLowerCase().includes(query));

            if (filtered.length === 0) {
                list.appendChild(el('div', { className: 'empty-state', style: { padding: '24px 10px' } }, [
                    el('div', { text: query ? 'কোনো লেনদেন মেলেনি' : 'এখনো কোনো লেনদেন নেই। নিচের "+" বাটনে চাপ দিন।' })
                ]));
                return;
            }

            const sorted = [...filtered].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            sorted.forEach(t => {
                const isInc = t.type === 'income';
                const sign = isInc ? '+' : '-';
                const color = isInc ? 'text-success' : 'text-danger';

                const item = el('div', { className: 'tx-item' }, [
                    el('div', { className: 'tx-info' }, [
                        el('div', { className: 'tx-desc', text: t.desc }),
                        el('div', { className: 'tx-meta', text: t.date || '' })
                    ]),
                    el('div', { style: { textAlign: 'right' } }, [
                        el('div', { className: `tx-amount ${color}`, text: `${sign}৳${Utils.formatMoney(t.amount)}` }),
                        el('div', { className: 'tx-actions' }, [
                            el('button', { className: 'icon-btn', onClick: () => App.Modals.openTxModal(t) }, [
                                el('div', { html: '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.995.995 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' })
                            ]),
                            el('button', { className: 'icon-btn', onClick: () => App.Modals.confirmDeleteTx(t) }, [
                                el('div', { html: '<svg viewBox="0 0 24 24" style="fill: var(--danger);"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' })
                            ])
                        ])
                    ])
                ]);
                list.appendChild(item);
            });
        }
    },

    Modals: {
        open(id) { document.getElementById(id).classList.add('active'); },
        close(id) { document.getElementById(id).classList.remove('active'); },
        closeOnClickOutside(e, id) { if (e.target.id === id) App.Modals.close(id); },

        openAccountModal(existingName = null) {
            const inp = document.getElementById('inp-account-name');
            const title = document.getElementById('modal-account-title');
            if (existingName) {
                title.textContent = "খাতার নাম পরিবর্তন";
                inp.value = existingName;
            } else {
                title.textContent = "নতুন খাতা তৈরি";
                inp.value = '';
                App.State.currentAccount = null;
            }
            this.open('modal-account');
            setTimeout(() => inp.focus(), 150);
        },

        openAccountActionModal() { this.open('modal-account-action'); },

        editCurrentAccount() {
            this.close('modal-account-action');
            this.openAccountModal(App.State.currentAccount);
        },

        confirmDeleteAccount() {
            this.close('modal-account-action');
            const count = (App.Data.transactions[App.State.currentAccount] || []).length;
            document.getElementById('confirm-title').textContent = "খাতা মুছে ফেলা";
            document.getElementById('confirm-msg').textContent = `"${App.State.currentAccount}" খাতার ভেতরে ${count}টি লেনদেন আছে। আপনি কি সম্পূর্ণ খাতাটি মুছে ফেলতে চান?`;
            document.getElementById('btn-confirm-action').onclick = App.Actions.deleteAccountConfirm;
            this.open('modal-confirm');
        },

        openTxModal(tx = null) {
            App.State.txEditMode = !!tx;
            App.State.currentTxId = tx ? tx.id : null;
            document.getElementById('modal-tx-title').textContent = tx ? "হিসাব সম্পাদনা" : "নতুন হিসাব যোগ";
            document.getElementById('inp-tx-desc').value = tx ? tx.desc : '';
            document.getElementById('inp-tx-amount').value = tx ? tx.amount : '';
            App.UI.selectTxType(tx ? tx.type : 'income');
            this.open('modal-tx');
            setTimeout(() => document.getElementById('inp-tx-desc').focus(), 150);
        },

        confirmDeleteTx(tx) {
            document.getElementById('confirm-title').textContent = "লেনদেন মুছে ফেলা";
            document.getElementById('confirm-msg').textContent = `"${tx.desc}" (৳${tx.amount}) মুছে ফেলতে চান?`;
            document.getElementById('btn-confirm-action').onclick = () => App.Actions.deleteTxConfirm(tx.id);
            this.open('modal-confirm');
        }
    }
};

// অ্যাপ স্বয়ংক্রিয়ভাবে চালু হওয়া
window.addEventListener('DOMContentLoaded', () => {
    App.init();
});
</script>
